# Configuration for the OPTIMIZED MANUAL Top Patterns Generator Pipeline

# Path to the directory containing country-specific pattern files.
input_patterns_path: "data/pattern_maker_output/"

# Path where the final 'top_patterns.parquet' file will be saved.
output_path: "data/preprocessed_bot_data/"

# Path for the temporary shuffle files. This will be created and deleted.
temp_path: "data/temp_shuffle_optimized/"

# The number of "buckets" to use for the optimized shuffle.
# More buckets can reduce memory usage during aggregation, but may be slower.
# A power of 2 is often a good choice. 512 is a safe start.
num_buckets: 512

# The number of top patterns to save in the final output file.
top_n_patterns: 200000

# --- Significance Score Component Weights ---
score_weights:
  length: 0.30
  average_correlation: 0.40
  scdi_count: 0.30
